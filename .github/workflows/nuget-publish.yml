name: Publish NuGet Package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    # The trusted publishing policy on nuget.org is scoped to the "production"
    # environment, so the OIDC token this job requests has to carry a matching
    # environment claim. Without this line the token has no environment claim, the
    # policy does not match, and the token exchange fails.
    #
    # The environment carries no protection rules, so it gates nothing; it exists to
    # put the claim in the token. Renaming it means updating the nuget.org policy too.
    environment: production

    # Permissions are listed explicitly because declaring any permission drops the
    # default token scopes, so every scope this job relies on has to be named here.
    permissions:
      # The "Create GitHub Release" step below creates a release for plain tag pushes.
      contents: write
      # Pushing to GitHub Packages authenticates with the job's GITHUB_TOKEN.
      packages: write
      # Lets the job request a GitHub OIDC token, which nuget.org exchanges for a
      # short-lived API key (trusted publishing). Without this the NuGet/login step
      # fails with "unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check if tag is on main branch
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        echo "Checking if tag $TAG_NAME exists on main branch..."
        
        # Check if the tag commit is reachable from main
        if ! git merge-base --is-ancestor $TAG_NAME origin/main; then
          echo "❌ Tag $TAG_NAME is not on main branch. Skipping release."
          echo "SKIP_RELEASE=true" >> $GITHUB_ENV
        else
          echo "✅ Tag $TAG_NAME is on main branch. Proceeding with release."
          echo "SKIP_RELEASE=false" >> $GITHUB_ENV
        fi

    - name: Skip if not on main branch
      if: env.SKIP_RELEASE == 'true'
      run: |
        echo "This tag is not on the main branch. Releases are only published from main branch tags."
        exit 0

    - name: Setup .NET
      if: env.SKIP_RELEASE != 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Determine version
      if: env.SKIP_RELEASE != 'true'
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
        else
          VERSION=${GITHUB_REF#refs/tags/v}
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION"

    - name: Update project version
      if: env.SKIP_RELEASE != 'true'
      run: |
        sed -i "s/<Version>.*<\/Version>/<Version>${{ steps.version.outputs.VERSION }}<\/Version>/" HumanReadableCalculationSteps/HumanReadableCalculationSteps.csproj
        sed -i "s/<AssemblyVersion>.*<\/AssemblyVersion>/<AssemblyVersion>${{ steps.version.outputs.VERSION }}<\/AssemblyVersion>/" HumanReadableCalculationSteps/HumanReadableCalculationSteps.csproj
        sed -i "s/<FileVersion>.*<\/FileVersion>/<FileVersion>${{ steps.version.outputs.VERSION }}<\/FileVersion>/" HumanReadableCalculationSteps/HumanReadableCalculationSteps.csproj

    - name: Restore dependencies
      if: env.SKIP_RELEASE != 'true'
      run: dotnet restore

    - name: Build
      if: env.SKIP_RELEASE != 'true'
      run: dotnet build --configuration Release --no-restore

    - name: Test
      if: env.SKIP_RELEASE != 'true'
      # TRX logger added so the release run also produces a downloadable test
      # report (mirrors the ci.yml workflow). A failing test here aborts the
      # publish — we should never push a package that didn't pass tests.
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test_results.trx" \
          --results-directory ./TestResults

    - name: Upload test results
      # Run even on failure so we can diagnose which test broke the release.
      if: env.SKIP_RELEASE != 'true' && always()
      uses: actions/upload-artifact@v4
      with:
        name: release-test-results-${{ github.run_id }}
        path: TestResults/*.trx
        retention-days: 30  # longer than ci.yml — release-time results are higher-stakes.

    - name: Pack
      if: env.SKIP_RELEASE != 'true'
      run: dotnet pack HumanReadableCalculationSteps/HumanReadableCalculationSteps.csproj --configuration Release --no-build --output ./artifacts

    # GitHub Packages goes first, and deliberately so. It authenticates with the job's
    # own GITHUB_TOKEN, so it has no external dependency and effectively always works.
    # nuget.org publishing has failed on a credential twice (an expired API key, then a
    # 502 from the trusted publishing token exchange), and while it sat first in this
    # job every such failure also cost us the GitHub Packages copy and the release,
    # leaving the version published nowhere at all.
    - name: Publish to GitHub Packages
      if: env.SKIP_RELEASE != 'true'
      run: |
        dotnet nuget add source --username AppifySheets --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/AppifySheets/index.json"
        dotnet nuget push ./artifacts/*.nupkg --source "github" --skip-duplicate

    # Trusted publishing: instead of a long-lived NUGET_API_KEY secret, the job proves
    # its identity to nuget.org with a GitHub OIDC token and receives an API key that
    # is valid for one hour. Nothing to rotate, and a leaked log line expires by itself.
    #
    # This only works if a matching policy exists on nuget.org (username menu ->
    # Trusted Publishing) naming: Repository Owner "AppifySheets", Repository
    # "human-readable-calculation-steps", Workflow File "nuget-publish.yml" (file name
    # only, no path) and Environment "production" to match the job above. Renaming this
    # file or that environment breaks publishing until the policy is updated.
    #
    # Pinned to v1.2.0 rather than the v1 floating tag for its enhanced logging: the
    # token exchange has been answering 502, and a policy mismatch would instead give a
    # 401 naming the field that differs, so the extra detail is what we have to go on.
    #
    # Each OIDC token buys exactly one API key, so the login has to sit immediately
    # before the push rather than at the top of the job.
    # continue-on-error because nuget.org's token endpoint has been answering this
    # exchange with an HTTP 502 since 2026-09-06, across two policy configurations and
    # two action versions. A real policy mismatch answers 401 naming the field that
    # differs (NuGet/login#9), so this is a fault on their side, not a misconfiguration
    # here. The push step below falls back to the API key so a broken token service
    # cannot stop a release; when nuget.org recovers, trusted publishing resumes on its
    # own and the key stops being read.
    - name: NuGet login (exchange OIDC token for a short-lived API key)
      if: env.SKIP_RELEASE != 'true'
      id: nuget-login
      continue-on-error: true
      uses: NuGet/login@v1.2.0
      with:
        # nuget.org profile name of the policy owner, NOT an email address.
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      if: env.SKIP_RELEASE != 'true'
      env:
        # Empty whenever the exchange above failed.
        TRUSTED_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        FALLBACK_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -n "$TRUSTED_KEY" ]; then
          echo "Publishing with a short-lived key from trusted publishing."
          KEY="$TRUSTED_KEY"
        elif [ -n "$FALLBACK_KEY" ]; then
          # Surfaced as a warning on the run so this never becomes the silent norm.
          echo "::warning::Trusted publishing was unavailable; falling back to the NUGET_API_KEY secret. Check whether nuget.org's token exchange works again, and drop the secret once it does."
          KEY="$FALLBACK_KEY"
        else
          echo "::error::Trusted publishing failed and no NUGET_API_KEY secret is set, so there is no way to authenticate to nuget.org."
          exit 1
        fi

        # Pushes the matching .snupkg alongside the .nupkg by itself.
        dotnet nuget push ./artifacts/*.nupkg --api-key "$KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    # Runs even when the nuget.org steps failed, so a tag push still gets its release.
    - name: Create GitHub Release
      if: always() && env.SKIP_RELEASE != 'true' && startsWith(github.ref, 'refs/tags/') && github.event_name != 'release'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false